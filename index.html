<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem('todo-app.theme.v1');
          var colors = {
            light: '#f5f6f8',
            dark: '#12161f',
            warm: '#f3ead9',
            contrast: '#000000',
          };
          if (!colors[theme]) return;
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', colors[theme]);
        } catch (error) {
          // The app falls back to the default theme when storage is unavailable.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="一个打开即可使用的个人待办工具，数据仅保存在当前浏览器。"
    />
    <title>Todo · 个人待办</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
